name: Safety issue
description: Report live trading, secrets, or operational safety concerns.
title: "Safety: "
body:
  - type: textarea
    id: risk
    attributes:
      label: Risk
      description: Describe the safety risk and affected workflow.
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: Impact
    validations:
      required: true
  - type: checkboxes
    id: checklist
    attributes:
      label: Safety checklist
      options:
        - label: Real order submission remains disabled by default.
          required: true
        - label: No secrets are included in this issue.
          required: true
        - label: Testnet behavior is not represented as production certification.
          required: true
