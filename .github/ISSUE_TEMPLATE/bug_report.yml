name: Bug report
description: Report a defect in the alpha system.
title: "Bug: "
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      value: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: Attach output from scripts/collect-diagnostics.sh when practical.
  - type: checkboxes
    id: safety
    attributes:
      label: Live trading safety
      options:
        - label: This bug does not require enabling production order submission to reproduce.
