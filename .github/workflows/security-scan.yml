name: Alpha Security Scan

on:
  pull_request:
  push:
    branches:
      - main
      - master

permissions:
  contents: read
  security-events: write

jobs:
  dependency-and-secret-scan:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/python/requirements.txt
            backend/python/requirements-dev.txt
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Frontend npm audit
        working-directory: frontend
        run: |
          npm ci
          npm audit --audit-level=moderate
        continue-on-error: true
      - name: Python pip-audit
        working-directory: backend/python
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt pip-audit
          python -m pip_audit
        continue-on-error: true
      - name: Java OWASP dependency check
        working-directory: backend/java
        run: mvn -B org.owasp:dependency-check-maven:check -DfailBuildOnCVSS=9
        continue-on-error: true
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        continue-on-error: true
